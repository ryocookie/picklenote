name: Android APK

# Tag a release (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to publish a signed APK
# to GitHub Releases, where Obtainium picks it up. Manual runs build a debug APK artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      # Node and Bun versions must match docs/fdroid/*.yml so F-Droid reproduces the release APK byte for byte.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.18
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4

      - name: Check tag matches versionName
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION_NAME=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' android/app/build.gradle)
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME in android/app/build.gradle"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build:android

      - name: Decode signing key
        if: env.IS_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. See docs/android-release.md"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.IS_RELEASE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/PickleNote-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/PickleNote-${GITHUB_REF_NAME}.apk" \
            --title "PickleNote $GITHUB_REF_NAME" --generate-notes

      - name: Build debug APK
        if: env.IS_RELEASE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        if: env.IS_RELEASE != 'true'
        with:
          name: PickleNote-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
